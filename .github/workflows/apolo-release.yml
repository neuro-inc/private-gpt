name: CI

on:
  push:
    branches: [apolo]
    tags: ["v*"]
  pull_request:
    branches: [apolo]

jobs:
  release:
    name: Release image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/apolo')
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build Docker image
        run: make build-image
      - name: Release development image
        run: |
          export IMAGE_TAG=development
          make push-image
      - name: Release production image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          export IMAGE_TAG=${GITHUB_REF#refs/tags/v}
          make push-image

          export IMAGE_TAG=latest
          make push-image
